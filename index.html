<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Osake Riesz</title>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        autoplay: "on",
        unmuteOverlay: "hidden",
        warnOnUnsupportedContent: false,
        logLevel: "warn",
        quality: "low",
        letterbox: "on"
      };
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;

      }

      body {
        display: grid;

        place-items: center;
      }

      #player {
        width: min(100vw, 960px);
        height: min(100vh, 720px);
        background: #000;
      }

      object,
      embed {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <object id="player" data="osake_riesz_e.swf" type="application/x-shockwave-flash">
      <param name="movie" value="osake_riesz_e.swf">
      <param name="quality" value="low">
      <embed src="osake_riesz_e.swf" type="application/x-shockwave-flash">
    </object>
  </body>
</html>
